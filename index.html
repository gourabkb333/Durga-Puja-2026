<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মা আসছে</title>
<meta name="description" content="Durga Puja countdown">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- decorative alpona backdrop -->
<svg class="bg-motif" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <circle cx="8" cy="10" r="1.4" />
  <circle cx="92" cy="14" r="1.4" />
  <circle cx="6" cy="88" r="1.4" />
  <circle cx="94" cy="90" r="1.4" />
</svg>

<header class="topbar">
  <div class="visitor-counter" id="visitorCounter" title="Total visitors">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <span id="visitorCount">—</span>
  </div>

  <div class="topbar-actions">
    <a class="icon-btn" id="youtubeBtn" href="#" target="_blank" rel="noopener" aria-label="Open YouTube playlist" title="My playlist">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1.5" y="5" width="21" height="14" rx="4" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10 9.5v5l4.5-2.5-4.5-2.5Z" fill="currentColor"/>
      </svg>
    </a>
    <button class="icon-btn" id="adminBtn" aria-label="Admin details" title="Admin">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8.5" r="3.4" stroke="currentColor" stroke-width="1.6"/>
        <path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<main class="hero">
  <img src="assets/durga-face.png" alt="মা দুর্গা" class="durga-face">
  <p class="eyebrow">শারদীয়া দুর্গোৎসব</p>
  <h1 class="headline">মা আসছে</h1>

  <div class="countdown" aria-live="polite">
    <span class="countdown-number" id="daysLeft">--</span>
    <span class="countdown-label">দিন বাকি</span>
  </div>

  <button class="dhak-btn" id="dhakBtn" aria-pressed="false" aria-label="Play dhak">
    <span class="dhak-ripple r1"></span>
    <span class="dhak-ripple r2"></span>
    <span class="dhak-ripple r3"></span>
    <img src="assets/dhak-icon.png" alt="" class="dhak-img">
  </button>
  <p class="dhak-caption" id="dhakCaption">ঢাক বাজাতে ট্যাপ করুন</p>
  <audio id="dhakAudio" preload="none"></audio>
</main>

<svg class="alpona-divider" viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 12 Q 25 0, 50 12 T 100 12 T 150 12 T 200 12 T 250 12 T 300 12 T 350 12 T 400 12 T 450 12 T 500 12 T 550 12 T 600 12"
        stroke="#D4A017" stroke-width="1.2" fill="none"/>
  <g fill="#A31621">
    <circle cx="0" cy="12" r="2.2"/><circle cx="50" cy="12" r="2.2"/><circle cx="100" cy="12" r="2.2"/>
    <circle cx="150" cy="12" r="2.2"/><circle cx="200" cy="12" r="2.2"/><circle cx="250" cy="12" r="2.2"/>
    <circle cx="300" cy="12" r="2.2"/><circle cx="350" cy="12" r="2.2"/><circle cx="400" cy="12" r="2.2"/>
    <circle cx="450" cy="12" r="2.2"/><circle cx="500" cy="12" r="2.2"/><circle cx="550" cy="12" r="2.2"/><circle cx="600" cy="12" r="2.2"/>
  </g>
</svg>

<section class="player" aria-label="Music player">
  <div class="player-inner">
    <div id="ytPlayer" class="yt-embed"></div>

    <!-- Track list drawer (live from your YouTube playlist) -->
    <div class="track-drawer" id="trackDrawer">
      <p class="playlist-heading" id="playlistHeading">আপনার প্লেলিস্ট</p>
      <ul class="track-list" id="trackList">
        <li class="track-empty" id="trackLoading">গান লোড হচ্ছে…</li>
      </ul>
    </div>

    <div class="seek-row">
      <span class="seek-time" id="seekCurrent">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <span class="seek-time" id="seekDuration">0:00</span>
    </div>

    <div class="player-controls">
      <button class="drawer-toggle" id="drawerToggle" aria-label="Show song list" aria-expanded="false">
        <svg id="drawerChevron" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
      </button>
      <div class="now-playing">
        <span class="np-label" id="npLabel">প্লে লিস্ট</span>
        <span class="np-title" id="npTitle">লোড হচ্ছে…</span>
      </div>
      <div class="transport">
        <button id="prevBtn" class="transport-btn" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6 9 12l11 6z"/></svg>
        </button>
        <button id="playBtn" class="transport-btn transport-btn--primary" aria-label="Play or pause">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="nextBtn" class="transport-btn" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="adminName">
    <button class="modal-close" id="adminClose" aria-label="Close">&times;</button>
    <img id="adminPhoto" class="modal-photo" alt="" src="">
    <h2 id="adminName" class="modal-name"></h2>
    <a id="adminLinkedin" class="modal-linkedin" href="#" target="_blank" rel="noopener">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a1.94 1.94 0 1 1-3.88 0 1.94 1.94 0 0 1 3.88 0ZM3.5 8.75h3.4V21h-3.4V8.75Zm6.13 0h3.26v1.68h.05c.45-.86 1.56-1.76 3.22-1.76 3.44 0 4.08 2.27 4.08 5.22V21h-3.4v-5.62c0-1.34-.02-3.06-1.87-3.06-1.87 0-2.16 1.46-2.16 2.96V21h-3.4V8.75Z"/></svg>
      LinkedIn
    </a>
    <a id="adminManagePlaylist" class="modal-manage-link" href="#" target="_blank" rel="noopener">আরও গান দেখুন YouTube-এ ↗</a>
  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
